# This repository's own CI: the harness's suite, the machine scripts' tests and lint, the
# workflows' lint, and an install into a fresh repository that must pass its own selftest.
name: CI

on:
  pull_request:
  merge_group: # the merge queue runs these checks again on top of the newest main
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: template/.nightbot/harness/go.mod
      - name: gofmt, vet and the tests
        working-directory: template/.nightbot/harness
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

  machine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The starters' tests
        working-directory: template/.nightbot/machine/starter
        run: python -B -m unittest -v
      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/*.yml template/.github/workflows/*.yml

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: template/.nightbot/harness/go.mod
      - name: Install into a fresh repository and run its selftest
        run: |
          target="$RUNNER_TEMP/widgets"
          git init -q -b main "$target"
          git -C "$target" remote add origin https://github.com/acme/widgets.git
          ./install.sh "$target" --bot-login widgets-bot --operator someone
          cd "$target/.nightbot/harness"
          go vet ./...
          go test ./...
          go run ./cmd/nightbot validate
